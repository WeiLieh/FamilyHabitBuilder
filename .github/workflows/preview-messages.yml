name: Preview messages

# [2026-11-15] Sends every message of the style C readability preview to the
# owner's Telegram, through a SEPARATE preview bot (never the live bot), so the
# owner can see the new house style on a real phone. See
# src/telegram-bot/preview-sender.ts for what is sent and how.
#
# When it runs: on every push to the preview branch that changes the preview or
# the sender, or by hand ("Run workflow" in GitHub's Actions tab).
on:
  push:
    branches: [claude/readability-style-c-preview]
    paths:
      - docs/handoffs/2026-11-15-readability-style-c-preview.html
      - src/telegram-bot/preview-sender.ts
      - .github/workflows/preview-messages.yml
  workflow_dispatch:

# Least privilege: this job may only read the code, never change it.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # 1. Download this repository's code.
      - uses: actions/checkout@v5
      # 2. Node.js 24 runs the TypeScript sender directly; it needs no libraries.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 3. Send. The preview bot's token is a GitHub secret the owner adds once;
      #    it is never written in the code. PREVIEW_CHAT_ID is optional: without
      #    it, the sender uses the chat that last sent /start to the preview bot.
      - run: node src/telegram-bot/preview-sender.ts
        env:
          PREVIEW_BOT_TOKEN: ${{ secrets.PREVIEW_BOT_TOKEN }}
          PREVIEW_CHAT_ID: ${{ secrets.PREVIEW_CHAT_ID }}
